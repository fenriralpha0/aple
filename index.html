<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dark Apples: Under-Souls Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <!-- PAINEL ESQUERDO: Informações gerais, Inimigos e Arte da Fogueira -->
        <div id="painel-esquerdo">
            <h1>🌑 DARK APPLES: UNDER-SOULS 🍎</h1>
            
            <div class="status-box" id="status-panel">
                Nv: 1 | Almas: 0 | ❤️ HP: 20/20 | ⚔️ Dano: 5 | 💨 Agilidade: 0 | 🍎 Maçãs: 5/5
            </div>

            <div class="narrativa" id="narrativa-texto">
                Bem-vindo ao reino corrompido, meu Soberano Fenrir. Escolha seu destino abaixo.
            </div>

            <div id="monstro-info" style="display: none;">
                <img id="monstro-arena" src="" alt="Inimigo">
                <h3 id="titulo-arena">⚔️ DESVIE DO PERIGO ⚔️</h3>
            </div>

            <!-- Canvas da Fogueira (Desenha a Imagem Completa e Faíscas) -->
            <div id="fogueira-arte-container" style="display: none;">
                <canvas id="canvasFogueira" width="500" height="400"></canvas>
            </div>

            <div id="menu-acoes">
                <button class="btn" onclick="explorar()">🌲 Explorar Ermos</button><br>
                <button class="btn" onclick="fogueira()">🔥 Descansar na Fogueira</button><br>
                <button class="btn" onclick="mostrarInventario()">🎒 Ver Feras Capturadas</button>
            </div>
        </div>

        <!-- PAINEL DIREITO: Só expande durante Combate ou Fogueira -->
        <div id="painel-direito">
            <!-- Arena de Combate -->
            <div id="arena-box" style="display: none;">
                <canvas id="canvasArena" width="400" height="400"></canvas>
                <p id="tempo-restante" style="margin-top: 10px; font-weight: bold;"></p>
            </div>

            <!-- Painel de Evolução da Fogueira -->
            <div id="fogueira-box" style="display: none;">
                <h2 style="color: #ffcc00; margin-bottom: 15px;">🔥 FOGUEIRA DAS ALMAS 🔥</h2>
                <div id="fogueira-status-detalhes" class="fogueira-info-box"></div>
                <div id="fogueira-botoes" class="fogueira-botoes-box"></div>
            </div>
        </div>
    </div>

    <!-- MODAL CENTRALIZADO -->
    <div id="modal-overlay">
        <div id="modal-box">
            <div id="modal-texto">Mensagem aqui</div>
            <div class="modal-botoes" id="modal-botoes-container">
                <button class="modal-btn" id="modal-btn-ok" onclick="fecharModal()">OK</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
